<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" dir="ltr">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fox Cafe</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="pics/favicon.svg">

</head>
<body>
    <nav class="navbar">
        <a href="#"><img src="pics/menu_icon.svg" alt="Menu" class="icon"></a>
        <h1 class="site-name">Fox Cafe</h1>
        <a href="#" class="push-right"><img src="pics/login_icon.svg" alt="Login" class="icon"></a>
        <a href="#"><img src="pics/shopping_cart_icon.svg" alt="Cart" class="icon"></a>
    </nav>

    <header class="banner_container"> 
        <img src="pics/fox_cafe_banner.png" alt="fox_cafe_banner" class="banner">
        <h2>Coffee is a hug in a mug</h2>
    </header> 

    <section class="menu-grid">
        <a href="#" class="menu-card">
            <img src="pics/hot-drinks.webp" alt="Hot drinks">
            <h3>Hot Drinks</h3>
            <p>Warm cups for chilly days.</p>
            <span class="more">Explore drinks →</span>
        </a>

        <a href="#" class="menu-card">
            <img src="pics/iced-drinks.webp" alt="Iced drinks">
            <h3>Iced Drinks</h3>
            <p>Cool, sweet and refreshing.</p>
            <span class="more">Explore drinks →</span>
        </a>

        <a href="#" class="menu-card">
            <img src="pics/freshly-baked.webp" alt="Freshly baked goods">
            <h3>Freshly Baked</h3>
            <p>Sweet things, made with love.</p>
            <span class="more">Explore treats →</span>
        </a>

        <a href="#" class="menu-card">
            <img src="pics/sugar-shelf.jpg" alt="The Sugar Shelf">
            <h3>The Sugar Shelf</h3>
            <p>Little treats to take home.</p>
            <span class="more">Explore the shelf →</span>
        </a>
    </section>
</body>
</html>
